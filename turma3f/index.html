.tc.on{background:rgba(255,255,255,.55)}

#bf{right:130px;width:84px;height:84px;font-size:16px;background:rgba(51,181,255,.5)}
#rot{position:fixed;inset:0;z-index:15;background:linear-gradient(#3a1d6e,#2a1650);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;color:#fff;font-family:'Baloo 2','Trebuchet MS',sans-serif}
#rot.on{display:flex}
#rot .ph{width:74px;height:128px;border:6px solid #fff;border-radius:16px;position:relative;background:linear-gradient(#6ec6ff,#d4f1ff);animation:turn 2.6s ease-in-out infinite;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#rot .ph::before{content:'';position:absolute;left:50%;top:6px;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:rgba(0,0,0,.25)}
#rot .ph i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#ff5fa2;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
#rot .ph i::before,#rot .ph i::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.4);left:6px;top:6px;box-shadow:9px 0 rgba(0,0,0,.4),0 9px rgba(0,0,0,.4),9px 9px rgba(0,0,0,.4)}
#rot .ph i::after{display:none}

@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@keyframes spin{0%,20%{transform:rotate(0);opacity:.3}50%,80%{transform:rotate(-180deg);opacity:1}100%{transform:rotate(0);opacity:.3}}
@media (prefers-reduced-motion:reduce){#rot .ph{animation:none;transform:rotate(-90deg)}#rot .ar{animation:none}}
#bl{left:16px}
#nm{position:fixed;display:none;z-index:6;border:3px solid #8e5cff;border-radius:12px;padding:0 10px;font-weight:800;font-family:'Baloo 2','Trebuchet MS',sans-serif;color:#3a1d6e;background:#fff;box-sizing:border-box;-webkit-user-select:text;user-select:text;outline:none}

<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT="'Baloo 2','Trebuchet MS',sans-serif";
let W=800;const H=480,T=32,ROWS=15;let scale=1,dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const vw=innerWidth,vh=innerHeight;W=Math.round(Math.max(560,Math.min(1000,H*vw/vh)));scale=Math.min(vw/W,vh/H);cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);}
addEventListener('resize',resize);resize();

// ---------- aparência ----------
const SKINS=['#ffe0c7','#f1c27d','#c68642','#8d5524'];
const HAIRS=['#3b2314','#7a4a24','#e8c15a','#c0462c','#1a1a1a'];
const DRESSES=['#ff5fa2','#8e5cff','#33b5ff','#3ccf6e','#ffb428','#ff4b4b'];
const STYLES_G=['Lisinho','Maria-chiquinha','Cacheado','Rabo de cavalo'],STYLES_B=['Curtinho','Espetado','Cacheadinho','Raspadinho'];
const BOTTOMS_G=['Saia','Bermuda','Calça'],BOTTOMS_B=['Bermuda','Calça'];const ROYAL='#2f5bea';
const ACCS=['Nada','Óculos','Laço','Boné'];
let saved={name:'',gender:0,skin:0,hair:1,style:0,bottom:0,acc:0,run:null,ach:{},stats:{buttons:0,right:0},levels:{},qAsked:[]};
const STAT0={buttons:0,right:0,ench:[],pots:[],swordKills:0};
try{Object.assign(saved,JSON.parse(localStorage.getItem('turma3f_save')||'{}'))}catch(e){}
if(!saved.run&&saved.level>1)saved.run={level:saved.level,cp:null,hearts:3,score:0,blaster:false,armor:0,nextHeartAt:30};delete saved.level;
if(!saved.sophia)saved.sophia={skin:1,hair:4,style:2,dress:3,acc:2};
if(saved.run&&!saved.run.frontier)saved.run.frontier=saved.run.level;saved.stats=Object.assign({},STAT0,saved.stats);
function save(){try{localStorage.setItem('turma3f_save',JSON.stringify(saved))}catch(e){}}

const THEMES=[
 {name:'Português',k:'port',sky:['#fff4de','#f3d9b1'],h2:'#e85d75',grass:'#d64545',dirt:'#a8653a',dot:'#8a4f2a'},
 {name:'Matemática',k:'mat',sky:['#ffffff','#eaf1ff'],h2:'#2f5bea',grass:'#2f5bea',dirt:'#dfe9f8',dot:'#b9cbe8'},
 {name:'Ciências',k:'cie',sky:['#e6f8ee','#c8eedb'],h2:'#3ccf6e',grass:'#58c040',dirt:'#8a5a2b',dot:'#6b4420'},
 {name:'História e Geografia',k:'hg',sky:['#f6e7c1','#ead197'],h2:'#e0a030',grass:'#7fbf5a',dirt:'#c9a46a',dot:'#a8854f'}];
const SUBJ_SHORT=['Português','Matemática','Ciências','Hist. e Geo.'];
const TOPIC_SHORT=['Alfabeto','Números','Sons','Campo e cidade','Substantivos','Contas','Luz e visão','Paisagens','Acentos','Multiplicação','Animais','Trabalho','Adjetivos','Divisão','Terra e solo','Meio ambiente'];

// ---------- som ----------
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,slide,delay){const a=AC;if(!a||muted)return;const t=a.currentTime+Math.max(0,delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const sfx={
 jump:()=>tone(380,.18,'square',.05,420),
 coin:()=>{tone(988,.07,'square',.05);tone(1319,.22,'square',.05,0,.06)},
 gold:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.12,'square',.045,0,i*.05)),
 stomp:()=>{tone(260,.15,'triangle',.18,-180);tone(520,.1,'square',.04,300,.05)},
 hurt:()=>tone(440,.4,'sawtooth',.07,-330),
 brick:()=>tone(120,.15,'triangle',.2,-60),
 bump:()=>tone(160,.08,'triangle',.15),
 power:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.13,'square',.045,0,i*.06)),
 heart:()=>[659,880,1319].forEach((f,i)=>tone(f,.16,'triangle',.09,0,i*.08)),
 check:()=>[523,784].forEach((f,i)=>tone(f,.2,'triangle',.09,0,i*.1)),
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,'square',.05,0,i*.12)),
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.1,0,i*.22)),
 click:()=>tone(660,.06,'square',.04),
 shoot:()=>tone(900,.09,'square',.04,-450),
 clank:()=>{tone(1400,.12,'triangle',.09,-700);tone(700,.2,'square',.03,-300,.04)},
 roar:()=>[110,98,82,73].forEach((f,i)=>tone(f,.28,'sawtooth',.08,-20,i*.15)),
 bossHit:()=>{tone(220,.2,'square',.08,-140);tone(110,.25,'triangle',.15,-50)},
 dash:()=>tone(260,.35,'sawtooth',.05,700),
 boom:()=>[1047,784,1319,1047,1568,2093].forEach((f,i)=>tone(f,.18,'square',.05,0,i*.09))};
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const MEL=[76,79,81,79,76,72,74,76,74,0,67,0,72,74,76,0,77,76,74,72,74,76,72,69,67,69,72,74,72,0,0,0];
const BAS=[48,48,43,48,41,43,43,48];
let musStep=0,musNext=0,musTimer=null;
function startMusic(){if(musTimer||!ac())return;musNext=AC.currentTime+.1;musTimer=setInterval(()=>{while(musNext<AC.currentTime+.2){if(!muted&&state==='play'){const d=musNext-AC.currentTime,sp=P&&(P.rainbow>0||(boss&&boss.active&&!boss.dead));const m=MEL[musStep%32];if(m)tone(NOTE(m+(sp?12:0)),.13,'triangle',.04,0,d);if(musStep%4===0)tone(NOTE(BAS[(musStep/4|0)%8]),.28,'square',.022,0,d)}musStep++;musNext+=(P&&(P.rainbow>0||(boss&&boss.active&&!boss.dead)))?.11:.15}},30)}

// ---------- gerador de fases ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genLevel(n){
 const R=rng(n*9973+7),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
 const mainLen=110+Math.min(n,6)*22,len=mainLen+48,g=[];for(let r=0;r<ROWS;r++)g.push(new Array(len).fill(' '));
 const ents=[],d=Math.min(1,(n-1)/5);
 const set=(c,r,ch)=>{if(c>=0&&c<len&&r>=0&&r<ROWS)g[r][c]=ch};
 const btn=(c,r)=>{if(c>=0&&c<len&&r>=0&&r<ROWS&&g[r][c]===' ')g[r][c]='o'};
 const ground=(c,top)=>{for(let r=top;r<ROWS;r++)set(c,r,'#')};
 const mon=()=>{const r=R();return n>=3&&r<.25?'pula':n>=2&&r<.5?'lesma':'fiapo'};
 let x=0,h=12,cp=false;for(;x<12;x++)ground(x,h);
 for(let i=5;i<9;i++)btn(i,h-2);
 while(x<mainLen){
  const t=R();
  if(!cp&&x>len/2){for(let i=0;i<5;i++)ground(x+i,h);ents.push({k:'check',c:x+2,r:h-1});x+=5;cp=true;continue}
  if(t<.25){const L=ri(6,10);for(let i=0;i<L;i++)ground(x+i,h);
   if(R()<.75){const s=x+ri(1,2),k=ri(3,5);for(let i=0;i<k;i++)btn(s+i,h-2-(i>0&&i<k-1?1:0))}
   if(R()<.55+d*.4)ents.push({k:mon(),c:x+ri(3,L-2),r:h-1});x+=L}
  else if(t<.42){const gw=ri(2,2+Math.round(d*2));for(let i=0;i<gw;i++)btn(x+i,h-3-(i>0&&i<gw-1?1:0));x+=gw;for(let i=0;i<3;i++)ground(x+i,h);x+=3}
  else if(t<.57){h=Math.max(9,Math.min(12,h+(R()<.5?-1:1)*ri(1,2)));const L=ri(4,7);for(let i=0;i<L;i++)ground(x+i,h);
   btn(x+ri(1,L-2),h-1);if(R()<.4)ents.push({k:mon(),c:x+ri(2,L-2),r:h-1});x+=L}
  else if(t<.8){const L=ri(8,11);for(let i=0;i<L;i++)ground(x+i,h);
   const br=h-4,s=x+ri(1,3),k=ri(3,5);for(let i=0;i<k;i++)set(s+i,br,R()<.35?'?':'B');set(s+Math.floor(k/2),br,'?');
   if(R()<.7)for(let i=0;i<k;i++)btn(s+i,br-1);
   if(R()<.3){const sp=s+Math.floor(k/2),q=R();set(sp,br,q<.25?'W':q<.5?'A':q<.68?'S':q<.86?'M':'K')}
   if(R()<.5+d*.3)ents.push({k:mon(),c:x+L-2,r:h-1});x+=L}
  else{const L=ri(9,13);ground(x,h);ground(x+1,h);ground(x+L-2,h);ground(x+L-1,h);
   const pit=L-4,ps=x+2+Math.floor((pit-3)/2),pr=h-3;for(let i=0;i<3;i++){set(ps+i,pr,'=');btn(ps+i,pr-1)}
   if(n>1&&R()<.45+d*.4)ents.push({k:'nuvem',c:ps+1,r:pr-4});x+=L}
 }
 // antes do chefão: ponto salvo + itens garantidos
 for(let i=0;i<8;i++)ground(x+i,h);ents.push({k:'check',c:x+1,r:h-1});set(x+2,h-4,'S');set(x+4,h-4,'W');set(x+6,h-4,'A');if(n===16)set(x,h-4,'K');x+=8;
 // arena do chefão
 const aL=x;h=12;for(let i=0;i<26;i++)ground(x+i,h);
 for(let i=0;i<3;i++){set(aL+5+i,8,'=');set(aL+17+i,8,'=')}
 const gateC=aL+25;for(let r=0;r<h;r++)set(gateC,r,'X');
 for(x=aL+26;x<len;x++)ground(x,h);
 return{g,len,ents,goalC:len-7,goalR:h-1,theme:(n-1)%4,arena:{L:aL,R:gateC}};
}

// ---------- estado ----------
let state='menu',lvl=null,levelN=1,cam=0,frame=0,shake=0,P=null;
let monsters=[],items=[],parts=[],bumps={},checks=[],goal=null,msgs=[];
let winSt=1,tileGot=0,monTotal=0,killsOrig=0,lostHeart=false;
let gChar=0,winWasF=true;
let boss=null,shots=[],eshots=[],bossBanner=0,gBlaster=false,gArmor=0,gSword=false,gGauge=[0,0,0,0,0,0],gateMsgT=0;
let hearts=3,buttonsGot=0,totalBtn=0,score=0,kills=0,combo=0,respawnC=2,winT=0,bannerT=0,nextHeartAt=30;
const solid=(c,r)=>{if(r<0||r>=ROWS)return false;if(c<0||c>=lvl.len)return true;const ch=lvl.g[r][c];return ch==='#'||ch==='B'||ch==='?'||ch==='U'||ch==='='||ch==='W'||ch==='A'||ch==='S'||ch==='M'||ch==='K'||ch==='X'};
function groundTop(c){for(let r=0;r<ROWS;r++)if(solid(c,r))return r*T;return 12*T}

function makeMon(e){const d=Math.min(1,(levelN-1)/5);const S={fiapo:[26,24,.8+d*.6],lesma:[30,22,.45],nuvem:[34,24,.9],pula:[26,24,.7]}[e.k];
 const m={k:e.k,w:S[0],h:S[1],sp:S[2],alive:true,dead:0,how:'',t:Math.random()*100|0,active:false,vx:0,vy:0,dir:-1,onGround:false};
 m.x=e.c*T+(T-m.w)/2;m.y=(e.r+1)*T-m.h;if(e.k==='nuvem'){m.baseY=e.r*T;m.homeX=m.x;m.y=m.baseY}return m}

function startLevel(n,cp){
 levelN=n;tileGot=0;monTotal=0;killsOrig=0;lostHeart=false;lvl=genLevel(n);shots=[];eshots=[];bossBanner=0;monsters=[];items=[];parts=[];bumps={};checks=[];msgs=[];
 buttonsGot=0;kills=0;combo=0;hearts=Math.max(hearts,3);
 totalBtn=0;for(const row of lvl.g)for(const ch of row)if(ch==='o')totalBtn++;
 for(const e of lvl.ents){if(e.k==='check')checks.push({c:e.c,x:e.c*T,y:(e.r+1)*T,on:!!cp&&e.c<=cp});else{const m=makeMon(e);m.orig=true;monTotal++;monsters.push(m)}}
 goal={x:lvl.goalC*T,y:(lvl.goalR+1)*T};respawnC=cp||2;
 P={x:respawnC*T,y:0,w:20,h:30,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,inv:0,rainbow:0,t:0,blaster:gBlaster,armor:gArmor,cool:0,cape:0,sword:gSword,swing:0,swCool:0,gauge:gGauge.slice(),ench:[0,0,0,0,0,0],pot:{jump:0,speed:0,magnet:0,double:0},dbl:false,char:teamN(n).includes(gChar)?gChar:0,barkCool:0,barkT:0,swapCool:0,hist:[]};
 boss=makeBoss(n,lvl.arena);
 P.y=groundTop(respawnC)-P.h;cam=Math.max(0,P.x-W*.4);state='play';bannerT=160;startMusic();
 if(n>=5)unlock('lvl5');if(n>=9)unlock('lvl10');saveRun(cp||null);
}
function saveRun(cp){saved.run={frontier:saved.unlockAll?frontier():Math.max(frontier(),levelN),level:levelN,cp,char:P.char,hearts:Math.max(hearts,1),score,blaster:P.blaster,armor:P.armor,sword:P.sword,gauge:P.gauge,nextHeartAt};save()}
function resumeRun(){const r=saved.run;hearts=r.hearts||3;score=r.score||0;nextHeartAt=r.nextHeartAt||30;gBlaster=!!r.blaster;gArmor=r.armor||0;gSword=!!r.sword;gGauge=(r.gauge||[0,0,0,0,0,0]).slice();gChar=r.char||0;const rg=regOf(r.level);openMap(rg,(r.level-1)%4+1);meetAll(rg,()=>{})}
function newGame(){if(!(saved.name||'').trim()){state='custom';custMsg=180;return}
 hearts=3;score=0;nextHeartAt=30;gBlaster=false;gArmor=0;gSword=false;gGauge=[0,0,0,0,0,0];gChar=0;saved.run={frontier:1,level:1,cp:null,hearts:3,score:0,char:0};save();
 openMap(0,0);map.dlg={i:0,lines:storyStart(),done:()=>mapWalk(1,()=>{map.enterT=50;map.enterN=1})}}
function storyStart(){const n=saved.name||'Você';return[{w:2,t:'Último dia de aula no 3F...'},
 {w:5,t:'Parabéns, turma! Vocês aprenderam tanta coisa este ano!'},
 {w:4,t:'HA HA HA! Eu sou o REI RABISCO! Vou apagar tudo o que vocês aprenderam!'},
 {w:4,t:'E a Professora vem comigo para o meu Castelo de Rabiscos!'},
 {w:5,t:'Socorro! '+n+', relembre tudo o que estudamos e venha me salvar!'},
 {w:0,t:'Pode deixar, Prô! Vou revisar o ano inteiro e salvar você!'},
 {w:2,t:'Cada bimestre tem 4 fases: Português, Matemática, Ciências e História e Geografia. Boa sorte!'}]}

// ---------- conquistas ----------
const ACH=[
 ['b_all','Colecionador de Estrelas','Pegar todas as estrelinhas de uma fase'],
 ['m_all','Caça-Rabiscos','Derrotar todos os monstrinhos de uma fase'],
 ['nohit','Sem um arranhão','Terminar uma fase sem perder coração'],

 ['boss_tesoura','Conta Certa','Vencer a Calculadora Maluca'],
 ['boss_trovao','Experiência de Sucesso','Vencer o Frasco Borbulhante'],
 ['boss_gelatina','Volta ao Mundo','Vencer o Globo Tonto'],
 ['combo3','Pula-pula','Pular em 3 monstrinhos sem tocar no chão'],

function mapCtrl(r){const Rn=rng(r*7919+3),xs=[.07,.23,.41,.59,.77,.93];let up=Rn()<.5;return xs.map(x=>{up=!up;return{x:x*W,y:H*(up?.40+Rn()*.07:.62+Rn()*.09)}})}
function mapSamples(r){const c=mapCtrl(r),out=[];for(let i=0;i<c.length-1;i++){const p0=c[Math.max(0,i-1)],p1=c[i],p2=c[i+1],p3=c[Math.min(c.length-1,i+2)];
 for(let k=0;k<SEG;k++){const t=k/SEG,t2=t*t,t3=t2*t,f=(a,b,c2,d)=>.5*(2*b+(-a+c2)*t+(2*a-5*b+4*c2-d)*t2+(-a+3*b-3*c2+d)*t3);out.push({x:f(p0.x,p1.x,p2.x,p3.x),y:f(p0.y,p1.y,p2.y,p3.y)})}}out.push(c[c.length-1]);return out}
function samp(S,pos){const i=Math.max(0,Math.min(S.length-2,Math.floor(pos))),f=Math.min(1,pos-i);return{x:S[i].x+(S[i+1].x-S[i].x)*f,y:S[i].y+(S[i+1].y-S[i].y)*f}}

function goNode(k){if(map.walk||map.dlg||map.enterT)return;const n=map.r*4+k;
 if(k===5){if(map.r<3&&access()>map.r*4+4)mapWalk(5,()=>startTravel(map.r+1));return}
 if(n>access())return;if(map.node===k){map.enterT=30;map.enterN=n;return}mapWalk(k,()=>{map.enterT=50;map.enterN=n})}
function updateMap(){map.t++;const S=mapSamples(map.r);
 if(map.walk){const w=map.walk,dir=Math.sign(w.to-map.pos);if(dir){map.face=dir;const i=Math.max(0,Math.min(S.length-2,Math.floor(map.pos-(dir<0?1e-6:0))));const L=Math.hypot(S[i+1].x-S[i].x,S[i+1].y-S[i].y)||1;map.pos+=dir*2.6/L}
  if(!dir||(dir>0&&map.pos>=w.to)||(dir<0&&map.pos<=w.to)){map.pos=w.to;map.node=w.k;map.walk=null;w.then&&w.then()}}
 const p=samp(S,map.pos);map.hist.push(p);if(map.hist.length>30)map.hist.shift();
 if(map.enterT>0){map.enterT--;if(map.enterT===0)enterLevel(map.enterN)}}
