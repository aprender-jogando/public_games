<title>Júlia e os Botões</title>
<meta name="description" content="Júlia e a Caça aos Botões: um jogo de plataforma para a Júlia, a prima Sophia e a Malú.">
<meta property="og:title" content="Júlia e a Caça aos Botões">
<meta property="og:description" content="Um jogo de plataforma feito com carinho para a Júlia.">

<style>
/* VOICE: alegre, infantil, colorido
   IDEA: caixa de costura da vovó virou um mundo de plataforma
   PICTURE: o próprio jogo em canvas
   COLOUR and TYPE: céu forte, rosa/roxo, Baloo 2
   LAYOUT: canvas centralizado + controles de toque */
html,body{margin:0;height:100%;background:#2a1650;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tc{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;color:#fff;font:800 30px 'Baloo 2',sans-serif;z-index:5;touch-action:none}
.tc.on{background:rgba(255,255,255,.55)}
#bk{right:130px;width:90px;height:90px;font-size:18px;background:rgba(255,210,63,.55)}
#bs{right:20px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 108px);width:84px;height:84px;font-size:16px;background:rgba(255,138,61,.5)}
#bf{right:130px;width:84px;height:84px;font-size:16px;background:rgba(51,181,255,.5)}
#rot{position:fixed;inset:0;z-index:15;background:linear-gradient(#3a1d6e,#2a1650);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;color:#fff;font-family:'Baloo 2','Trebuchet MS',sans-serif}
#rot.on{display:flex}
#rot .ph{width:74px;height:128px;border:6px solid #fff;border-radius:16px;position:relative;background:linear-gradient(#6ec6ff,#d4f1ff);animation:turn 2.6s ease-in-out infinite;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#rot .ph::before{content:'';position:absolute;left:50%;top:6px;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:rgba(0,0,0,.25)}
#rot .ph i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#ff5fa2;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
#rot .ph i::before,#rot .ph i::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.4);left:6px;top:6px;box-shadow:9px 0 rgba(0,0,0,.4),0 9px rgba(0,0,0,.4),9px 9px rgba(0,0,0,.4)}
#rot .ph i::after{display:none}
#rot .ar{font-size:44px;color:#ffd23f;animation:spin 2.6s ease-in-out infinite;line-height:1}
#rot h2{margin:0;font-size:26px;font-weight:800;line-height:1.15}
#rot p{margin:0;font-size:17px;opacity:.85}
#rot button{font:800 18px 'Baloo 2','Trebuchet MS',sans-serif;color:#fff;background:#8e5cff;border:3px solid #fff;border-radius:30px;padding:10px 26px;min-height:48px}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@keyframes spin{0%,20%{transform:rotate(0);opacity:.3}50%,80%{transform:rotate(-180deg);opacity:1}100%{transform:rotate(0);opacity:.3}}
@media (prefers-reduced-motion:reduce){#rot .ph{animation:none;transform:rotate(-90deg)}#rot .ar{animation:none}}
#bl{left:16px}
#cover{position:fixed;inset:0;z-index:20;background:#2a1650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px}
#cover img{max-width:96vw;max-height:80vh;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#cover p{margin:0;color:#ffe066;font:800 20px 'Trebuchet MS',sans-serif;text-align:center}#br{left:112px}#bj{right:20px;width:96px;height:96px;font-size:20px;background:rgba(255,95,162,.45)}
</style>

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genLevel(n){
